<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0c1013">
    <title>DEEPWAKE — Expedition Console</title>
    <link rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath fill='%23f3aa62' d='m20 1 17 9v20l-17 9-17-9V10Zm0 8-9 5 9 5 9-5Zm-11 11v7l8 5v-8Zm22 0-8 4v8l8-5Z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
  </head>
  <body data-mode="title">
    <header class="mast">
      <div
        class="brand"><svg class="brandmark" viewBox="0 0 40 40" aria-hidden="true"><path fill="#f3ac69" d="M20 1 37 10.5 20 20 3 10.5z"/><path fill="#e9954e" d="m3 13.5 15.5 8.7v16L3 29.2z"/><path fill="#aa663c" d="m37 13.5-15.5 8.7v16L37 29.2z"/><path fill="#202124" d="m20 6 8 4.5-8 4.4-8-4.4z"/></svg><span>DEEPWAKE</span></div>
      <nav
        aria-label="Expedition navigation"><button id="navExp" class="nav active">Expedition</button><button id="manual" class="nav">Field manual</button><button id="records" class="nav">Records</button></nav>
      <div
        class="header-tools"><button id="mute" class="tool" aria-label="Mute audio"></button><button id="full" class="tool icon-only" aria-label="Enter fullscreen" title="Fullscreen"></button><button id="pause" class="tool icon-only" aria-label="Pause expedition" title="Pause"></button></div>
    </header>
    <main>
      <section class="stage" id="stage" aria-label="Expedition viewport">
  <canvas id="world" aria-label="The underground expedition with ILO"></canvas>
  <div class="shade title-only"></div><i class="edge tl"></i><i class="edge tr"></i><i class="edge bl"></i><i class="edge br"></i>
  <div class="telemetry title-only"><span class="live"><i></i>LIVE FEED</span><i class="vline"></i><span>CAM_01</span></div>
  <div class="hud" id="hud"></div>
  <div class="title-content title-only">
    <div class="eyebrow"><span class="short-line"></span> A VOXEL EXPEDITION</div>
    <h1><span class="sr">DEEPWAKE</span><svg id="title-mark" preserveAspectRatio="xMinYMid meet" aria-hidden="true"></svg></h1>
    <p>Restore three resonance relays.<br>Bring the ascent lift back online.</p>
    <button class="begin" id="begin"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5 14 8 3 14.5Z" fill="currentColor"/></svg>Begin Expedition <kbd>↵</kbd></button>
  </div>
  <div class="feed-bottom title-only"><span class="location"><span data-icon="pin"></span> SECTOR 01 <b>/</b> BURIED WORKSHOP</span><span class="depth"><span data-icon="depth"></span> DEPTH <strong>−486 M</strong></span></div>
  <div id="prompt" class="prompt"></div><div id="notice" aria-live="polite"></div><div id="transition" aria-live="polite"></div>
  <div id="touch"><div><button data-key="left" aria-label="Move left">◀</button><button data-key="right" aria-label="Move right">▶</button></div><div><button data-key="pulse" aria-label="Echo pulse">Pulse</button><button data-key="interact" aria-label="Interact">Use</button><button data-key="dash" aria-label="Dash">Dash</button><button data-key="jump" aria-label="Jump">Jump</button></div></div>
 </section>
      <section class="overview title-only" aria-labelledby="route-heading">
        <div
          class="section-label"><h2 id="route-heading"><span data-icon="route"></span> Expedition route</h2><span class="rule"></span><span class="mono dim">03 REGIONS</span></div>
        <div id="routes" class="route-grid"></div>
      </section>
      <section class="controls-strip"
        aria-label="Keyboard controls"><h2><span data-icon="keyboard"></span> Controls</h2><div class="key-list"><span><kbd>A</kbd><kbd>D</kbd> Move</span><span><kbd>Space</kbd> Jump</span><span><kbd>Shift</kbd> Dash</span><span><kbd>Q</kbd> Pulse</span><span><kbd>E</kbd> Interact</span></div><button id="guideLink" class="text-btn">Field manual <span data-icon="book"></span></button></section>
    </main>
    <dialog id="panel" aria-labelledby="panelTitle">
      <div
        class="dialog-bar"><span class="mono">EXPEDITION CONSOLE</span><button id="closePanel" class="tool icon-only" aria-label="Close dialog">×</button></div>
      <div class="dialog-body" id="panelBody"></div>
    </dialog>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
