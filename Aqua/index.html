  <style>

import * as THREE from 'three';

const choose = (array,rng=random) => array[Math.floor(rng()*array.length)];

const clockTime={value:0};
// Shared environment levels: lamp (1 day, 0 night), filter strength (0 off, 1 default, 2 full),
// surface agitation and the flow-weighted clock that carries suspended motes.
const dayLevel={value:1}, filterLevel={value:1}, waveGain={value:1}, driftClock={value:0};
const mood={day:1,dayGoal:1,flow:1,flowGoal:1};
const obstacles=[], swimmers=[], bodies=[], plantGroups=[], fishModels=[], perches=[];
const tapSlots=Array.from({length:3},()=>new T.Vector4(0,-40,0,-30));
let renderer, world, camera, controls, shellScene, waterScene, sceneColor, waterColor, blitScene, blitCamera;
let tank, water, filter, crab, bottomSnail, glassSnail, particles, studio, lamp, school, seahorse, clam, food, sand;
let simTime=0, paused=false, lastStamp=0, frameDirty=true, renderQuality=1, opticalSize=new T.Vector2(1,1);
const canvas=document.getElementById('view');
const dummy=new T.Object3D(), unitY=v3(0,1,0), unitX=v3(1,0,0);
const sphereGeo = new T.SphereGeometry(1,24,16);
const smallSphere = new T.SphereGeometry(1,12,9);
const cubeGeo = new T.BoxGeometry(1,1,1);
function group(name,parent) {

function mesh(g,geo,mat,x=0,y=0,z=0) {

}
function ellipsoid(g,mat,x,y,z,rx,ry,rz,geo=sphereGeo) {

}

}

  return mesh(g,new RoundedBoxGeometry(w,h,d,2,r),mat,x,y,z);
}
function cylinder(g,mat,x,y,z,rt,rb,h,n=32) {

// Merge rigid parts in local space, retaining material boundaries and vertex colors.

// One Eulerian velocity field sampled by the plume, vegetation, fins, food, dust and motes.
// The filter drives it: an updraft over the airlift and a slow roll that leaves the plume

function currentAt(x,y,z,t,out) {

    ambient*.008*Math.cos(x+.3*t)+f*(.15*plume-.028*Math.cos(X)*Math.sin(Y)),

const mineralNormalGLSL=`
  vec3 dx=dFdx(-vViewPosition),dy=dFdy(-vViewPosition);
  vec3 tx=cross(dy,normal),ty=cross(normal,dx);
  float det=dot(dx,tx);
  normal=normalize(abs(det)*normal-sign(det)*(dFdx(mineralHeight)*tx+dFdy(mineralHeight)*ty));`;
const currentGLSL=`
uniform float uFilter;
vec3 waterCurrent(vec3 p,float t) {
  vec2 d=p.xz-vec2(3.03,-1.14);
  float ambient=.14+.86*uFilter,X=3.14159265*(p.x+3.97)/7.94,Y=3.14159265*clamp(p.y/4.55,0.,1.);
  return vec3(ambient*(.043*sin(.79*p.y+.46*p.z+.52*t)+.026*sin(1.17*p.z-.33*t))+uFilter*.050*sin(X)*cos(Y),
              ambient*.008*cos(p.x+.3*t)+uFilter*(.15*exp(-3.*dot(d,d))-.028*cos(X)*sin(Y)),
              ambient*(.038*sin(.73*p.x-.41*t)+.021*cos(.86*p.y+.35*t)));

// Everything underwater is lit through the surface by the light bar. Caustics are projected
// along rays from the fixture, so the cells widen with depth and fade away from the lamp.
const LAMP_Y=5.60, LAMP_ORIGIN=9.4;
const lightingGLSL=`
float hash21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

// Ambient sound, synthesised with the Web Audio API. Nothing exists until the viewer turns the
// sound on; after that every level is approached by a ramp, so nothing clicks. Pooled voices
// play the one-off sounds, so the simulation never creates audio nodes while it runs.
const sound=(()=>{
  let ctx=null,master,tone,hum,wash,swell,thud,enabled=false,voice=0,tick=0,lastPatter=0,thudFree=0,sleep=0;

// A short press that does not travel is a knock on the glass; anything longer or wider stays a
// camera drag. The knock is traced to the pane it lands on and passed to every inhabitant.
const raycaster=new T.Raycaster(),pointerNdc=new T.Vector2(),knockPoint=v3(),knockInward=v3();
let tapCursor=0,pendingVisit=null;
function knockAt(clientX,clientY){
  const rect=canvas.getBoundingClientRect();
  pointerNdc.set((clientX-rect.left)/rect.width*2-1,-((clientY-rect.top)/rect.height)*2+1);
  raycaster.setFromCamera(pointerNdc,camera);
  const o=raycaster.ray.origin,d=raycaster.ray.direction,lo=[-4.023,.02,-2.023],hi=[4.023,5.0,2.023];
  let enter=-Infinity,exit=Infinity,face=-1;
  for(let i=0;i<3;i++){
    const k=axes[i];
    if(Math.abs(d[k])<.000001){if(o[k]<lo[i]||o[k]>hi[i])return;continue;}
    let t1=(lo[i]-o[k])/d[k],t2=(hi[i]-o[k])/d[k];if(t1>t2){const swap=t1;t1=t2;t2=swap;}
    if(t1>enter){enter=t1;face=i;}
    exit=Math.min(exit,t2);
  }
  if(face<0||enter>exit||enter<=0)return;
  knockPoint.copy(o).addScaledVector(d,enter);
  let power=1;
  if(face===1){
    // Through the open top a finger meets the water, not glass: a ripple and a milder fright.
    if(d.y>=0)return;
    knockPoint.copy(o).addScaledVector(d,(WATER-o.y)/d.y);
    if(Math.abs(knockPoint.x)>3.9||Math.abs(knockPoint.z)>1.9)return;
    emitRipple(knockPoint.x,knockPoint.z,simTime,.022,true);knockInward.set(0,-1,0);power=.6;
  }else{
    knockInward.set(0,0,0);knockInward[axes[face]]=-Math.sign(knockPoint[axes[face]]);
    tapSlots[tapCursor].set(knockPoint.x,knockPoint.y,knockPoint.z,simTime);tapCursor=(tapCursor+1)%tapSlots.length;
  }
  const t=simTime;
  for(const s of swimmers)startleSwimmer(s,knockPoint,power,t);
  school.startle(knockPoint,power,t);seahorse.userData.flinch(knockPoint,power,t);crab.userData.alarm(knockPoint,t);
  bottomSnail.userData.tuck(knockPoint,t);glassSnail.userData.tuck(knockPoint,t);clam.userData.shut(knockPoint,t);
  sound.knock(power);
  pendingVisit={at:t+between(3.2,4.6),point:knockPoint.clone(),inward:knockInward.clone()};
  frameDirty=true;
}
// A few seconds after a knock, one or two of the nearest fish come back to look at the spot.
function inviteCurious(t){
  const {point,inward}=pendingVisit;pendingVisit=null;
  if(food.count>0)return;
  const guests=swimmers.filter(s=>!s.meal&&t>=s.fleeUntil).sort((a,b)=>a.rig.group.position.distanceToSquared(point)-b.rig.group.position.distanceToSquared(point));
  let invited=0;const wanted=random()<.55?2:1;
  for(const s of guests){
    if(invited>=wanted)break;
    const spot=v3();let found=false;
    for(let n=0;n<14&&!found;n++){
      spot.copy(point).addScaledVector(inward,s.r+.08+n*.03);
      if(n){spot.x+=inward.x?0:between(-.5,.5);spot.y+=inward.y?0:between(-.35,.35);spot.z+=inward.z?0:between(-.4,.4);}
      spot.x=clamp(spot.x,-3.9+s.r,3.9-s.r);spot.z=clamp(spot.z,-1.9+s.r,1.9-s.r);
      spot.y=clamp(spot.y,swimFloor(s,spot.x,spot.z)+.05,swimCeiling(s)-.05);
      found=insideSwimSpace(spot,s)&&!sweptSolid(spot,spot,s);
    }
    if(!found)continue;
    s.curious={spot,tap:point,until:t+12,arrived:false};s.restUntil=0;s.deadline=t+2;invited++;
  }
}
function setNight(night){

  document.getElementById('daynight').setAttribute('aria-pressed',String(night));
  document.getElementById('day-label').textContent=night?'Night':'Day';
  document.getElementById('sun-icon').toggleAttribute('hidden',night);document.getElementById('moon-icon').toggleAttribute('hidden',!night);
  frameDirty=true;
}
function toggleSound(){

  document.getElementById('sound-on-mark').toggleAttribute('hidden',!on);document.getElementById('sound-off-mark').toggleAttribute('hidden',on);
}
function setFlow(input){
  mood.flowGoal=input.value/50;input.style.setProperty('--fill',input.value+'%');
}
function feed(){
  if(food.drop())frameDirty=true;
}
function wireInteraction(){
  document.getElementById('playback').addEventListener('click',()=>setPaused(!paused));
  document.getElementById('reset').addEventListener('click',resetView);
  document.getElementById('feed').addEventListener('click',feed);
  document.getElementById('daynight').addEventListener('click',()=>setNight(mood.dayGoal>.5));
  document.getElementById('sound').addEventListener('click',toggleSound);
  const flow=document.getElementById('flow');flow.addEventListener('input',()=>setFlow(flow));setFlow(flow);
  window.addEventListener('resize',()=>resize());
  document.addEventListener('visibilitychange',()=>{lastStamp=0;sound.sync();});
  window.addEventListener('keydown',e=>{
    if(e.altKey||e.ctrlKey||e.metaKey||e.target.closest('button,input'))return;
    if(e.code==='Space'){e.preventDefault();if(!e.repeat)setPaused(!paused);}
    if(e.repeat)return;
    if(e.code==='KeyR')resetView();
    if(e.code==='KeyF')feed();
    if(e.code==='KeyN')setNight(mood.dayGoal>.5);
    if(e.code==='KeyM')toggleSound();
  });
  // Tell a knock from a drag by how far and how long the pointer travelled.
  let press=null;
  canvas.addEventListener('pointerdown',e=>{
    press=e.isPrimary&&e.button===0&&!e.shiftKey&&!e.ctrlKey&&!e.metaKey?{id:e.pointerId,x:e.clientX,y:e.clientY,at:performance.now(),travel:0}:null;
  });
  canvas.addEventListener('pointermove',e=>{
    if(press&&e.pointerId===press.id)press.travel=Math.max(press.travel,Math.hypot(e.clientX-press.x,e.clientY-press.y));
  });
  canvas.addEventListener('pointerup',e=>{
    if(!press||e.pointerId!==press.id)return;

    if(brief&&still)knockAt(e.clientX,e.clientY);
  });
  canvas.addEventListener('pointercancel',()=>{press=null;});
  systems.push((dt,t)=>{if(pendingVisit&&t>=pendingVisit.at)inviteCurious(t);});
}

// Camera fitting uses all eight corners of the aquarium and plinth.
let homeDistance=15;
const homeDir=v3(.395,.268,1).normalize(), homeTarget=v3(0,2.20,0);
const cameraRay=v3(),panDelta=v3();
function fitDistance(width,height){
  const mobile=width<=700,top=mobile?108:Math.max(45,height*.092);
  // The room kept free below the tank is whatever the control dock really occupies.
  const dock=document.querySelector('.dock').getBoundingClientRect();
  const bottom=Math.max(mobile?150:Math.max(110,height*.147),dock.height>0?height-dock.top+12:0);
  const allowedHeight=Math.max(height*.32,height-top-bottom),allowedWidth=width*(mobile?.915:.888);
  const right=v3().crossVectors(unitY,homeDir).normalize(),up=v3().crossVectors(homeDir,right).normalize();
  const focal=height/(2*Math.tan(T.MathUtils.degToRad(camera.fov*.5))),corners=[];
  for(const x of [-4.19,4.19])for(const y of [-.56,LAMP_Y+.21])for(const z of [-2.19,2.19]){
    const p=v3(x,y,z).sub(homeTarget);corners.push([p.dot(right),-p.dot(up),p.dot(homeDir)]);
  }
  let near=5.5,far=97,center=0;
  for(let i=0;i<29;i++){
    const d=(near+far)*.5;
    let left=Infinity,right=-Infinity,high=Infinity,low=-Infinity;
    for(const [x,y,z] of corners){
      const scale=focal/(d-z);left=Math.min(left,x*scale);right=Math.max(right,x*scale);
      high=Math.min(high,y*scale);low=Math.max(low,y*scale);
    }
    if(low-high>allowedHeight||right-left>allowedWidth)near=d;
    else{far=d;center=(low+high)*.5;}
  }
  const horizontal=width>1000&&width/height>1.25?-Math.min(42,width*.023):0;
  camera.setViewOffset(width,height,horizontal,center+(bottom-top)*.5,width,height);
  return far;
}
function resetView(){
  // Drain OrbitControls' residual drag before restoring the saved pose.
  controls.enableDamping=false;controls.update();controls.enableDamping=true;
  controls.target.copy(homeTarget);camera.position.copy(homeDir).multiplyScalar(homeDistance).add(homeTarget);
  controls.update();frameDirty=true;
}
function resize(first=false){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  camera.aspect=w/h;
  const old=homeDistance;homeDistance=fitDistance(w,h);controls.maxDistance=Math.max(35,homeDistance*1.7);
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.65));renderer.setSize(w,h,false);
  sizeOpticalTargets();
  if(first)resetView();else camera.position.sub(controls.target).multiplyScalar(homeDistance/old).add(controls.target);
  controls.update();frameDirty=true;
}
function sizeOpticalTargets(){
  renderer.getDrawingBufferSize(opticalSize);opticalSize.multiplyScalar(renderQuality).floor();
  sceneColor.setSize(opticalSize.x,opticalSize.y);waterColor.setSize(opticalSize.x,opticalSize.y);
}
let shadowStamp=-1,frameSum=0,frameCount=0,qualityTier=0;
function tuneRendering(frameSeconds){
  if(frameSeconds<=0||frameSeconds>.15)return;
  frameSum+=frameSeconds;frameCount++;
  if(frameCount<120)return;
  const average=frameSum/frameCount;frameSum=0;frameCount=0;
