// Rotate a joint in its parent's space so the open palm reaches the staff.
function reachForStaff(weight){
  const goal=staff.localToWorld(V(0,.33,.015));
  const tip=hands[1].getWorldPosition(V());
  goal.lerpVectors(tip,goal,weight);
  for(let pass=0;pass<4;pass++){
    for(const joint of [elbows[1],arms[1]]){
      const origin=joint.getWorldPosition(V());
      const current=hands[1].getWorldPosition(V()).sub(origin).normalize();
      const desired=goal.clone().sub(origin).normalize();
      const basis=joint.parent.getWorldQuaternion(new T.Quaternion()).invert();
      const rot=new T.Quaternion().setFromUnitVectors(current.applyQuaternion(basis),desired.applyQuaternion(basis));
      joint.quaternion.premultiply(rot);
    }
  }
}
